cluster: 
  iterations: 1 
  tmp_dir: "/tmp/cbt" 
  health_wait: 60 
  pool_profiles: 
    rep_test: 
      pg_size: 32
      pgp_size: 32
      replication: 3
    erasure42:
      pg_size: 2048
      pgp_size: 2048
      replication: 'erasure'
      erasure_profile: 'ec42' 
      ec_overwrites: True
  erasure_profiles:
    ec42:
      erasure_k: 4
      erasure_m: 2
      plugin: isa

benchmarks: 
  radosbench: 
    op_size: 
      - 4096
    write_only: true 
    # read_only: True
    # readmode: seq
    # prefill_time: 30
    time: 300 
    concurrent_ops: 128 
    concurrent_procs: 16 
    target_pool: test 
    rebuild_every_test: False
    pool_profile: erasure42 
